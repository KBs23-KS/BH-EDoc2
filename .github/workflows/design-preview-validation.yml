name: BHS Design Preview Validation
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install packages
        run: npm install --no-audit --no-fund
      - name: Numbering rules
        run: node tests/test-numbering.cjs
      - name: Document workflow rules
        run: node tests/workflow-test.mjs
      - name: Protected Google Apps Script backup API
        run: node tests/gas-backup-auth-test.cjs
      - name: Missing Drive attachment policy
        run: node tests/backup-policy-test.mjs
      - name: Remember backup secret preference
        run: node tests/backup-secret-prefs-test.mjs
      - name: Routing and assignment rules
        run: node tests/routing-upgrade-test.mjs
      - name: Director/deputy menu and optional password regression
        run: node tests/role-menu-password-test.mjs
      - name: Signed PDF source fallback regression
        run: node tests/pdf-signature-local-test.mjs
      - name: Teacher dashboard document totals
        run: node tests/teacher-dashboard-totals-test.mjs
      - name: Sidebar scroll position on navigation
        run: node tests/sidebar-navigation-scroll-test.mjs
      - name: Hide optional sidebar links without deleting functionality
        run: node tests/hide-optional-sidebar-links-test.mjs
      - name: Red today badge visual regression
        run: node tests/today-badge-style-test.mjs
      - name: Director orders and circulars approval label
        run: node tests/director-approve-label-test.mjs
      - name: Secure PDF signing API regression
        run: node tests/secure-signing-endpoint-test.mjs
      - name: Low-memory PDF editor regression
        run: node tests/pdf-signing-memory-test.mjs
      - name: Director signature ink color regression
        run: node tests/director-signature-ink-test.mjs
      - name: Dashboard explanatory note removal regression
        run: node tests/stats-note-removal-test.mjs
      - name: Admin trial archiving safety checks
        run: node tests/order-trial-archive-test.mjs
      - name: Admin number settings and bulk archival integration regression
        run: node tests/admin-order-archive-integration-test.mjs
      - name: Number policy active-only regression
        run: node tests/order-number-policy-test.mjs
      - name: Admin full number control regression
        run: node tests/admin-full-number-control-test.mjs
      - name: Order register responsive layout and login security UI regression
        run: node tests/login-order-layout-regression-test.mjs
      - name: Official school crest and approved login design regression
        run: node tests/login-official-crest-regression-test.mjs
      - name: Vite production build
        run: npm run build
