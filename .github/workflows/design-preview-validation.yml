name: BHS Design Preview Validation
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install packages
        run: npm install --no-audit --no-fund
      - name: Numbering rules
        run: node tests/test-numbering.cjs
      - name: Document workflow rules
        run: node tests/workflow-test.mjs
      - name: Protected Google Apps Script backup API
        run: node tests/gas-backup-auth-test.cjs
      - name: Missing Drive attachment policy
        run: node tests/backup-policy-test.mjs
      - name: Remember backup secret preference
        run: node tests/backup-secret-prefs-test.mjs
      - name: Routing and assignment rules
        run: node tests/routing-upgrade-test.mjs
      - name: Director/deputy menu and optional password regression
        run: node tests/role-menu-password-test.mjs
      - name: Signed PDF source fallback regression
        run: node tests/pdf-signature-local-test.mjs
      - name: Teacher dashboard document totals
        run: node tests/teacher-dashboard-totals-test.mjs
      - name: Sidebar scroll position on navigation
        run: node tests/sidebar-navigation-scroll-test.mjs
      - name: Hide optional sidebar links without deleting functionality
        run: node tests/hide-optional-sidebar-links-test.mjs
      - name: Vite production build
        run: npm run build
