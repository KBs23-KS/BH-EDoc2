name: Verify BHS web push changes
on:
  pull_request:
  push:
    branches:
      - feat/persistent-session-web-push-20261103
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test and build
        run: npm run build
